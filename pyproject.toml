[project]
name = "mac_lookup"
version = "0.1.1"
description = "Simple script to query for MAC address vendor info"
authors = [{ name = "Mitch Haddadi", email = "12067255+dfirsec@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "requests",
    "pyyaml",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_lookup_core"]
